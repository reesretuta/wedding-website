<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Claire & Rees</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600&family=Outfit:wght@300;400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <header class="hero" id="hero">
    <div class="hero-media" id="heroMedia" aria-hidden="true"></div>
    <div class="hero-veil"></div>
    <div class="hero-copy">
      <p class="eyebrow" id="dateLabel"></p>
      <h1 id="coupleNames">Claire &amp; Rees</h1>
      <p class="tagline" id="tagline">A collection of our wedding day.</p>
      <a class="cta" href="#gallery">View the gallery</a>
    </div>
  </header>

  <main id="gallery" class="gallery-section">
    <header class="gallery-head">
      <h2>The day</h2>
      <p id="galleryCount" class="gallery-meta"></p>
    </header>
    <div id="grid" class="grid" aria-label="Wedding photo gallery"></div>
    <p id="empty" class="empty" hidden>
      Photos aren’t ready yet. From the project folder run:
      <code>node scripts/prepare-photos.js</code>
      then refresh.
    </p>
  </main>

  <footer class="site-footer">
    <p id="footerNames">Claire &amp; Rees</p>
  </footer>

  <div id="lightbox" class="lightbox" hidden>
    <button type="button" class="lb-close" id="lbClose" aria-label="Close">✕</button>
    <button type="button" class="lb-nav prev" id="lbPrev" aria-label="Previous">‹</button>
    <img id="lbImg" class="lb-img" alt="" />
    <button type="button" class="lb-nav next" id="lbNext" aria-label="Next">›</button>
    <p id="lbCaption" class="lb-caption"></p>
  </div>

  <script src="/app.js"></script>
</body>
</html>
